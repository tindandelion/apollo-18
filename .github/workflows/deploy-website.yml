name: Deploy Apollo 18 Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Run quality gate
        uses: ./.github/actions/quality-gate

      - name: Install Trunk
        uses: taiki-e/install-action@v2.84.0
        with:
          tool: trunk@0.21.14
          fallback: none

      - name: Build website
        working-directory: crates/web
        env:
          TRUNK_BUILD_PUBLIC_URL: "${{ steps.pages.outputs.base_path }}/"
        run: NO_COLOR=true trunk build --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
