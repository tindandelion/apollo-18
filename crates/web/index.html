<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apollo 18 — First Triangle</title>
    <link data-trunk rel="rust" href="Cargo.toml" />
    <style>
      :root {
        color: #f2f2f2;
        background: #181818;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100vw, 100vh);
        max-width: 800px;
        padding: 1rem;
        box-sizing: border-box;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
      }

      p {
        margin: 0 0 1rem;
        color: #cccccc;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apollo 18</h1>
      <p>A shared Rust software renderer drawing its first triangle.</p>
      <canvas id="apollo18-canvas" width="800" height="800" aria-label="Flat triangle render"></canvas>
    </main>
  </body>
</html>
